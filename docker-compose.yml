services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cybersentinel-api
    ports:
      - "8001:8000"
    environment:
      CYBERSENTINEL_DATABASE_URL: sqlite:////data/cybersentinel.db
      CYBERSENTINEL_OLLAMA_URL: http://host.docker.internal:11434
      CYBERSENTINEL_OLLAMA_MODEL: qwen3:4b
    volumes:
      - cybersentinel-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: cybersentinel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: cybersentinel-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  cybersentinel-data:
  prometheus-data:
  grafana-data:
