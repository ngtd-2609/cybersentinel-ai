services:
  redis:
    image: redis:8-alpine
    container_name: cybersentinel-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    container_name: cybersentinel-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cybersentinel}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybersentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cybersentinel-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      CYBERSENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cybersentinel}
      CYBERSENTINEL_REDIS_URL: redis://redis:6379/0
      CYBERSENTINEL_RATE_LIMIT_FAIL_CLOSED: "true"
      CYBERSENTINEL_TRUST_PROXY_HEADERS: "true"
      CYBERSENTINEL_INGESTION_API_KEYS: ${CYBERSENTINEL_INGESTION_API_KEYS:-local-development-ingestion-key}
      CYBERSENTINEL_NOTIFICATION_WEBHOOK_URL: ${CYBERSENTINEL_NOTIFICATION_WEBHOOK_URL:-}
      CYBERSENTINEL_NOTIFICATION_SLACK_WEBHOOK_URL: ${CYBERSENTINEL_NOTIFICATION_SLACK_WEBHOOK_URL:-}
    volumes:
      - cybersentinel-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cybersentinel-worker
    command: [".venv/bin/python", "-m", "cybersentinel_ai.ingestion.worker"]
    env_file:
      - .env
    environment:
      CYBERSENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cybersentinel}
      CYBERSENTINEL_REDIS_URL: redis://redis:6379/0
      CYBERSENTINEL_INGESTION_API_KEYS: ${CYBERSENTINEL_INGESTION_API_KEYS:-local-development-ingestion-key}
      CYBERSENTINEL_NOTIFICATION_WEBHOOK_URL: ${CYBERSENTINEL_NOTIFICATION_WEBHOOK_URL:-}
      CYBERSENTINEL_NOTIFICATION_SLACK_WEBHOOK_URL: ${CYBERSENTINEL_NOTIFICATION_SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybersentinel-frontend
    ports:
      - "3002:3000"
    environment:
      CYBERSENTINEL_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:latest
    container_name: cybersentinel-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: cybersentinel-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  cybersentinel-data:
  prometheus-data:
  postgres-data:
  grafana-data:
  redis-data:
