services:
  api:
    environment:
      CYBERSENTINEL_ENVIRONMENT: portfolio
      CYBERSENTINEL_ENFORCE_PRODUCTION_CONFIG: "true"
      CYBERSENTINEL_SECRET_KEY: ${CYBERSENTINEL_SECRET_KEY:?Generated by scripts/start-demo.sh}
      CYBERSENTINEL_CORS_ORIGINS: http://localhost:3002
      CYBERSENTINEL_TRUSTED_HOSTS: api,localhost,127.0.0.1
      CYBERSENTINEL_PUBLIC_REGISTRATION_ENABLED: "false"
      CYBERSENTINEL_OLLAMA_URL: http://127.0.0.1:1
      CYBERSENTINEL_OLLAMA_TIMEOUT: "2"
      CYBERSENTINEL_OLLAMA_MAX_RETRIES: "0"
      CYBERSENTINEL_ALLOW_EXTERNAL_AI: "false"
      CYBERSENTINEL_ALLOW_SENSITIVE_EXTERNAL_AI: "false"
      CYBERSENTINEL_DEMO_SEED_ENABLED: "true"
      CYBERSENTINEL_DEMO_USER_EMAIL: demo@cybersentinel.local
      CYBERSENTINEL_DEMO_USER_USERNAME: portfolio-demo
      CYBERSENTINEL_DEMO_USER_PASSWORD: ${CYBERSENTINEL_DEMO_USER_PASSWORD:?Generated by scripts/start-demo.sh}

  frontend:
    build:
      args:
        NEXT_PUBLIC_DEMO_LOGIN_ENABLED: "true"
    environment:
      NEXT_PUBLIC_DEMO_LOGIN_ENABLED: "true"
      CYBERSENTINEL_DEMO_EMAIL: demo@cybersentinel.local
      CYBERSENTINEL_DEMO_PASSWORD: ${CYBERSENTINEL_DEMO_USER_PASSWORD:?Generated by scripts/start-demo.sh}
