[project]
name = "cybersentinel-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nguyễn Tùng Dương", email = "duong.nguyentung2609@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "joblib>=1.5.3",
    "mlflow==3.15.2",
    "numpy>=2.5.2",
    "pandas==2.3.3",
    "prometheus-client>=0.26.0",
    "protobuf==6.33.6",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
    "xgboost>=3.4.1",
]

[project.scripts]
cybersentinel-ai = "cybersentinel_ai:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
