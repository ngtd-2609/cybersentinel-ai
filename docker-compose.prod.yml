services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports: !reset []

  api:
    environment:
      CYBERSENTINEL_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      CYBERSENTINEL_SECRET_KEY: ${CYBERSENTINEL_SECRET_KEY:?Set CYBERSENTINEL_SECRET_KEY}
      CYBERSENTINEL_ENVIRONMENT: production
      CYBERSENTINEL_ENFORCE_PRODUCTION_CONFIG: "true"
      CYBERSENTINEL_CORS_ORIGINS: https://${CYBERSENTINEL_HOSTNAME:?Set CYBERSENTINEL_HOSTNAME}
      CYBERSENTINEL_TRUSTED_HOSTS: ${CYBERSENTINEL_HOSTNAME},api,localhost,127.0.0.1
    ports: !reset []

  frontend:
    ports: !reset []

  prometheus:
    ports: !reset []

  grafana:
    ports: !reset []

  nginx:
    image: nginx:1.29-alpine
    container_name: cybersentinel-nginx
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/cybersentinel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
